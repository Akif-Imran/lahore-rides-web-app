name: ride-booking

# The one-shot `migrate` job and the long-running `backend` run the same image with the same
# database settings. Values come from the root .env (see .env.example).
x-backend-db-env: &backend-db-env
  NODE_ENV: production
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}

# Least privilege for app containers: no Linux capabilities, no privilege escalation, and a
# read-only root filesystem (the app never writes to disk; /tmp is an in-memory tmpfs).
x-hardening: &hardening
  init: true
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: ['no-new-privileges:true']

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    ports:
      - '${POSTGRES_HOST_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs only when the volume is first initialised: creates <db>_test for integration tests.
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # Pre-deploy step, as in production: apply migrations, then the idempotent seed, then exit.
  # The API only starts once this has completed successfully.
  migrate:
    <<: *hardening
    # Built by the `backend` service below; never pulled from a registry.
    image: ride-booking-backend:local
    pull_policy: never
    command: ['sh', '-c', 'node dist/scripts/migrate.js up && node dist/seed/seed.js']
    environment:
      <<: *backend-db-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  backend:
    <<: *hardening
    image: ride-booking-backend:local
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      <<: *backend-db-env
      PORT: 3001
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      DRIVER_LOCATION_TTL_SECONDS: ${DRIVER_LOCATION_TTL_SECONDS:-120}
      RIDE_REQUEST_TTL_SECONDS: ${RIDE_REQUEST_TTL_SECONDS:-300}
      RATE_LIMIT_LIMIT: ${RATE_LIMIT_LIMIT:-120}
      RATE_LIMIT_CREATE_RIDE_LIMIT: ${RATE_LIMIT_CREATE_RIDE_LIMIT:-10}
    ports:
      - '${BACKEND_HOST_PORT:-3001}:3001'
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # Health check is defined in the image (GET /api/v1/health/live).

  frontend:
    <<: *hardening
    image: ride-booking-frontend:local
    build:
      context: ./frontend
      args:
        # Build-time only: inlined into the browser bundle, so it is the URL the *browser* uses.
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:3001/api/v1}
    restart: unless-stopped
    # No runtime environment needed: PORT and HOSTNAME are set in the image.
    # Next's server may write its cache under .next/cache; everything else stays read-only.
    tmpfs: [/tmp, /app/.next/cache]
    ports:
      - '${FRONTEND_HOST_PORT:-3000}:3000'
    depends_on:
      backend:
        condition: service_healthy
    # Health check is defined in the image (GET /).

volumes:
  pgdata:
